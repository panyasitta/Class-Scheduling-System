    if (canDelete) btns.push('<button class="btn btn-danger" data-act="delete"><i class="bi bi-trash"></i> ลบ</button>');
    btns.push('<button class="btn" data-act="close">ปิด</button>');
    if (canApprove) {
      btns.push('<button class="btn btn-danger" data-act="reject"><i class="bi bi-x-lg"></i> ไม่อนุมัติ</button>');
      btns.push('<button class="btn btn-success" data-act="approve"><i class="bi bi-check-lg"></i> อนุมัติ</button>');
    }
    if (canSubstitute) {
      btns.push('<button class="btn btn-primary" data-act="auto-sub"><i class="bi bi-magic"></i> หาครูสอนแทนอัตโนมัติ</button>');
    }
    Modal.open({
      title: 'รายละเอียดการลา', html: html, footer: btns.join(''),
      onOpen: function (c) {
        c.querySelector('[data-act="close"]').addEventListener('click', Modal.close);
        if (canDelete) {
          c.querySelector('[data-act="delete"]').addEventListener('click', function () {
            confirmModal({ title: 'ลบรายการลา?', danger: true }).then(function (yes) {
              if (!yes) return;
              Spinner.show('กำลังลบ...');
              call('absence.delete', { id: a.id }).then(function () {
                Spinner.hide(); Modal.close(); toast('ลบเรียบร้อย', 'success'); pageAbsences();

            });
          });
        }
        if (canApprove) {
          c.querySelector('[data-act="approve"]').addEventListener('click', function () {
            Spinner.show('กำลังอนุมัติ...');
            call('absence.approve', { id: a.id, action: 'approve' }).then(function () {
              Spinner.hide(); Modal.close(); toast('อนุมัติเรียบร้อย', 'success'); pageAbsences();
            }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); });
          });
          c.querySelector('[data-act="reject"]').addEventListener('click', function () {
            confirmModal({ title: 'ไม่อนุมัติคำขอลา?', danger: true, okText: 'ไม่อนุมัติ' }).then(function (yes) {
              if (!yes) return;
              Spinner.show('กำลังประมวลผล...');
              call('absence.approve', { id: a.id, action: 'reject' }).then(function () {
                Spinner.hide(); Modal.close(); toast('ปฏิเสธเรียบร้อย', 'info'); pageAbsences();
              }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); });
            });
          });
        }
        if (canSubstitute) {
          c.querySelector('[data-act="auto-sub"]').addEventListener('click', function () {
            Modal.close(); openSubstituteAutoModal(a);
          });
        }
      }
    });

  function openSubstituteAutoModal(absence) {

    call('absence.affectedSchedule', { absence_id: absence.id }).then(function (r) {
      Spinner.hide();

      var listHtml = r.items.map(function (s) {
        var sub = findMaster(Store.masters.subjects, s.subject_id);

        return '<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px">'
          + '<div style="font-weight:700">คาบ ' + esc(pr ? pr.no : '?') + ' · ' + esc(sub ? sub.code : '') + ' ' + esc(sub ? sub.name : '') + '</div>'
          + '<div style="font-size:12px;color:var(--ink-muted)">' + esc(cls ? cls.level : '') + ' · ' + esc(pr ? (pr.start_time + '-' + pr.end_time) : '') + '</div>'
          + '<button class="btn btn-sm btn-primary" style="margin-top:6px" data-find="' + esc(s.id) + '"><i class="bi bi-search"></i> เลือกครูสอนแทน</button>'
          + '</div>';
      }).join('');
      var html = ''
        + '<div style="background:#fef3c7;border-left:3px solid #f59e0b;padding:10px;border-radius:6px;margin-bottom:12px;font-size:12px">'
        +   '<i class="bi bi-info-circle"></i> วันที่ ' + TH.dateLongWeekday(r.date) + ' มี ' + r.items.length + ' คาบที่ต้องจัดสอนแทน'
        + '</div>'
        + listHtml
        + '<div style="text-align:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">'

        + '</div>';
      Modal.open({
        title: 'จัดครูสอนแทน', html: html, footer: '<button class="btn" data-act="close">ปิด</button>', size: 'large',
        onOpen: function (c) {
          c.querySelector('[data-act="close"]').addEventListener('click', Modal.close);
          c.querySelector('[data-act="auto-all"]').addEventListener('click', function () {
            confirmModal({ title: 'จัดอัตโนมัติทุกคาบ?', message: 'ระบบจะหาครูที่เหมาะสมที่สุดให้ทุกคาบ', icon: 'bi-magic', color: '#10b981', color2: '#059669' }).then(function (yes) {
              if (!yes) return;
              Spinner.show('กำลังจัด...');
              call('substitute.autoAssign', { absence_id: absence.id }).then(function (r) {
                Spinner.hide(); Modal.close();
                toast('จัดสอนแทนสำเร็จ ' + r.assigned + '/' + r.total + ' คาบ', 'success', 5000);
                pageAbsences();
              }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); });
            });
          });
          $$('[data-find]', c).forEach(function (b) {
            b.addEventListener('click', function () {
              var sid = b.getAttribute('data-find');
              Modal.close();
              openCandidatesModal(sid, r.date, absence.id);
            });
          });
        }
      });
    }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); });
  }

  function openCandidatesModal(scheduleId, date, absenceId) {
    Spinner.show('กำลังค้นหาครูสอนแทน...');
    call('substitute.candidates', { schedule_id: scheduleId, date: date }).then(function (r) {
      Spinner.hide();
      var sub = r.subject;
      var cls = r.class;
      var headHtml = '<div style="background:linear-gradient(135deg,#eef2ff,white);border-left:3px solid var(--brand-1);padding:10px;border-radius:6px;margin-bottom:12px">'
        + '<div style="font-weight:700">' + esc(sub ? (sub.code + ' ' + sub.name) : '') + '</div>'
        + '<div style="font-size:12px;color:var(--ink-muted)">ชั้น ' + esc(cls ? cls.level : '') + ' · ครูเดิม: ' + esc(r.original_teacher ? (r.original_teacher.full_name || r.original_teacher.username) : '') + '</div></div>';
      var cards = r.candidates.map(function (cd, idx) {
        var isBest = idx === 0 && cd.available;
        var avatar = cd.avatar_url
          ? '<img src="' + esc(cd.avatar_url) + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover" referrerpolicy="no-referrer">'
          : esc((cd.full_name || '?').charAt(0).toUpperCase());
        return '<div class="cand-card ' + (cd.available ? '' : 'is-busy') + (isBest ? ' is-best' : '') + '" data-tid="' + esc(cd.teacher_id) + '">'
          + '<div class="avatar-circle">' + avatar + '</div>'
          + '<div class="cand-info">'
          +   '<div class="cand-name">' + esc(cd.full_name) + (isBest ? ' <span class="cand-tag" style="background:#10b981;color:white">แนะนำ</span>' : '') + '</div>'
          +   '<div class="cand-meta">' + esc(cd.subject_group || '-') + ' · โหลดเดือนนี้: ' + cd.load_this_month + ' คาบ' + (cd.reason ? ' · <span style="color:#dc2626">' + esc(cd.reason) + '</span>' : '') + '</div>'
          +   (cd.match_tags.length ? '<div class="cand-tags">' + cd.match_tags.map(function (t) { return '<span class="cand-tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '')
          + '</div>'
          + '<div class="cand-score">' + cd.score + '</div>'
          + '</div>';
      }).join('');
      Modal.open({
        title: 'เลือกครูสอนแทน', html: headHtml + '<div style="display:flex;flex-direction:column;gap:8px">' + cards + '</div>',
        footer: '<button class="btn" data-act="close">ปิด</button>',
        size: 'large',
        onOpen: function (c) {
          c.querySelector('[data-act="close"]').addEventListener('click', Modal.close);
          $$('.cand-card', c).forEach(function (cd) {
            if (cd.classList.contains('is-busy')) return;
            cd.addEventListener('click', function () {
              var tid = cd.getAttribute('data-tid');
              Spinner.show('กำลังมอบหมาย...');
              call('substitute.assign', {
                absence_id: absenceId,
                schedule_id: scheduleId,
                substitute_teacher_id: tid,
                date: date
              }).then(function () {
                Spinner.hide(); Modal.close();
                toast('มอบหมายสอนแทนเรียบร้อย', 'success');
                pageAbsences();
              }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); });
            });
          });
        }
      });
    }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); });
  }

  function renderSubList(items) {
    if (!items.length) return '<div class="empty-state"><i class="bi bi-inbox"></i><p>ไม่มีรายการสอนแทน</p></div>';
    var rows = items.map(function (s) {
      var statusBadge = s.status === 'assigned' ? '<span class="badge b-assigned">มอบหมายแล้ว</span>'
        : s.status === 'completed' ? '<span class="badge b-completed">เสร็จสิ้น</span>'
        : '<span class="badge b-cancelled">ยกเลิก</span>';
      var avatar = s._substitute_avatar
        ? '<img src="' + esc(s._substitute_avatar) + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover" referrerpolicy="no-referrer">'
        : esc((s._substitute_teacher_name || '?').charAt(0).toUpperCase());
      return '<div class="card-item" data-id="' + esc(s.id) + '">'
        + '<div style="display:flex;align-items:center;gap:10px">'
        +   '<div class="avatar-circle">' + avatar + '</div>'
        +   '<div style="flex:1;min-width:0"><div style="font-weight:700">' + esc(s._substitute_teacher_name) + '</div>'
        +   '<div style="font-size:11px;color:var(--ink-muted)">สอนแทน: ' + esc(s._original_teacher_name) + '</div></div>'
        +   statusBadge
        + '</div>'
        + '<div style="background:var(--brand-soft);padding:8px;border-radius:8px;margin-top:6px">'
        +   '<div style="font-weight:600;font-size:13px;color:var(--brand-1)">' + esc(s._subject_code) + ' ' + esc(s._subject_name) + '</div>'
        +   '<div style="font-size:11px;color:var(--ink-muted)">ชั้น ' + esc(s._class_level) + ' · คาบ ' + esc(s._period_no) + ' (' + esc(s._period_time) + ')</div>'
        + '</div>'
        + '<div style="font-size:11px;color:var(--ink-muted);margin-top:4px"><i class="bi bi-calendar"></i> ' + TH.dateLong(s.date) + '</div>'
        + '</div>';
    }).join('');
    return '<div class="cards-grid">' + rows + '</div>';
  }

  function wireSubList(d) {
    $$('.cards-grid .card-item').forEach(function (card) {
      card.addEventListener('click', function () {
        var id = card.getAttribute('data-id');
        var s = d.items.filter(function (x) { return String(x.id) === String(id); })[0];
        if (s) openSubDetailModal(s);

  function openSubDetailModal(s) {
    var canComplete = (String(s.substitute_teacher_id) === String(Store.user.id) && s.status === 'assigned') || hasCap('substitute.manage');
    var canCancel = hasCap('substitute.manage') && s.status === 'assigned';
    var statusBadge = s.status === 'assigned' ? '<span class="badge b-assigned">มอบหมายแล้ว</span>'
      : s.status === 'completed' ? '<span class="badge b-completed">เสร็จสิ้น</span>'
      : '<span class="badge b-cancelled">ยกเลิก</span>';
    var html = ''
    + '<div style="text-align:center;margin-bottom:14px">' + statusBadge + '</div>'
    + '<div class="field"><label class="field-label">วิชา</label><div style="font-weight:700">' + esc(s._subject_code) + ' ' + esc(s._subject_name) + '</div></div>'
    + '<div class="field"><label class="field-label">ชั้น / ห้อง</label><div>' + esc(s._class_level) + ' · ห้อง ' + esc(s._room_code || '-') + '</div></div>'
    + '<div class="field"><label class="field-label">วันที่</label><div>' + TH.dateLongWeekday(s.date) + '</div></div>'
    + '<div class="field"><label class="field-label">คาบ</label><div>คาบ ' + esc(s._period_no) + ' · ' + esc(s._period_time) + '</div></div>'
    + '<div class="field"><label class="field-label">ครูเดิม</label><div>' + esc(s._original_teacher_name) + '</div></div>'
    + '<div class="field"><label class="field-label">ครูสอนแทน</label><div style="color:var(--brand-1);font-weight:600">' + esc(s._substitute_teacher_name) + '</div></div>'
    + (s.note ? '<div class="field"><label class="field-label">หมายเหตุ</label><div>' + esc(s.note) + '</div></div>' : '');
    var btns = ['<button class="btn" data-act="close">ปิด</button>'];
    if (canCancel) btns.push('<button class="btn btn-warning" data-act="cancel-sub"><i class="bi bi-x-lg"></i> ยกเลิก</button>');
    if (canComplete && s.status === 'assigned') btns.push('<button class="btn btn-success" data-act="complete"><i class="bi bi-check-lg"></i> เสร็จสิ้น</button>');
    Modal.open({
      title: 'รายละเอียดสอนแทน', html: html, footer: btns.join(''),
      onOpen: function (c) {
        c.querySelector('[data-act="close"]').addEventListener('click', Modal.close);
        if (canComplete) {
          var bc = c.querySelector('[data-act="complete"]');
          if (bc) bc.addEventListener('click', function () {
            Spinner.show('กำลังบันทึก...');
            call('substitute.complete', { id: s.id }).then(function () {
              Spinner.hide(); Modal.close(); toast('บันทึกเสร็จสิ้น', 'success'); pageSubstitutes();
            }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); });
          });
        }
        if (canCancel) {
          c.querySelector('[data-act="cancel-sub"]').addEventListener('click', function () {
            confirmModal({ title: 'ยกเลิกการมอบหมาย?', danger: true, okText: 'ยกเลิก' }).then(function (yes) {
              if (!yes) return;
              Spinner.show('กำลังยกเลิก...');
              call('substitute.cancel', { id: s.id }).then(function () {
                Spinner.hide(); Modal.close(); toast('ยกเลิกเรียบร้อย', 'info'); pageSubstitutes();
              }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); });
            });
          });
        }
      }
    });

  function renderUserList(items) {
    if (!items.length) return '<div class="empty-state"><i class="bi bi-inbox"></i><p>ไม่พบผู้ใช้</p></div>';
    var roleLabels = (Store.boot.role_labels) || {};
    var rows = items.map(function (u) {
      var rl = roleLabels[u.role] || { label: u.role, icon: 'bi-person' };
      var avatar = u.avatar_url
        ? '<img src="' + esc(u.avatar_url) + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover" referrerpolicy="no-referrer">'
        : esc((u.full_name || u.username || '?').charAt(0).toUpperCase());
      return '<div class="card-item" data-id="' + esc(u.id) + '">'
        + '<div style="display:flex;align-items:center;gap:10px">'
        +   '<div class="avatar-circle avatar-lg">' + avatar + '</div>'
        +   '<div style="flex:1;min-width:0"><div style="font-weight:700">' + esc(u.full_name || u.username) + '</div>'
        +   '<div style="font-size:11px;color:var(--ink-muted)">' + esc(u.email || '') + '</div>'
        +   '<span class="role-chip role-chip-' + esc(u.role) + '" style="margin-top:4px"><i class="bi ' + rl.icon + '"></i> ' + esc(rl.label) + '</span>'
        + '</div></div>'
        + '</div>';
    }).join('');
    return '<div class="cards-grid">' + rows + '</div>';
  }

  function wireUserList(d) {
    $$('.cards-grid .card-item').forEach(function (card) {
      card.addEventListener('click', function () {

        var u = d.items.filter(function (x) { return String(x.id) === String(id); })[0];
        if (u) openUserEditModal(u);
      });
    });
  }

    var html = ''

    + '<div class="field"><label class="field-label">Telegram Chat ID</label>'

    + '<div class="field-hint">เปิดบอท @userinfobot ใน Telegram เพื่อดู Chat ID ของคุณ</div></div>'
    + (isEdit && canManage ? '<div class="field"><label class="field-label" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="uf-reset"> รีเซ็ตรหัสผ่านเป็น 123456</label></div>' : '');

      btns.push('<button class="btn btn-danger" data-act="delete"><i class="bi bi-trash"></i> ปิดบัญชี</button>');
    }
    btns.push('<button class="btn btn-primary" data-act="save"><i class="bi bi-check-lg"></i> บันทึก</button>');
    Modal.open({
      title: isEdit ? 'แก้ไขผู้ใช้' : 'เพิ่มผู้ใช้ใหม่', html: html, footer: btns.join(''),
      onOpen: function (c) {

          var payload = {
            id: u.id || null,
            full_name: $('#uf-name').value,
            email: $('#uf-email').value,
            phone: $('#uf-phone').value,

            payload.role = $('#uf-role').value;

          if (!isEdit) payload.username = $('#uf-username').value;
          if (!payload.full_name) return toast('กรุณากรอกชื่อ', 'warning');

        });
        var del = c.querySelector('[data-act="delete"]');

            if (!yes) return;

            call('user.delete', { id: u.id }).then(function () {
              Spinner.hide(); Modal.close(); toast('ปิดบัญชีเรียบร้อย', 'info'); pageUsers();
            }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); });
          });
        });
      }
    });
  }

    + '<button class="btn btn-primary" id="pf-save" style="margin-left:auto"><i class="bi bi-check-lg"></i> บันทึก</button>'
    + '</div></div>';
    $('#page').innerHTML = html;
    $('#pf-cp').addEventListener('click', openChangePasswordModal);
    $('#pf-save').addEventListener('click', function () {
      var payload = {
        full_name: $('#pf-name').value,
        email: $('#pf-email').value,
        phone: $('#pf-phone').value,
        avatar_url: $('#pf-avatar').value,
        telegram_chat_id: $('#pf-tg').value
      };
      Spinner.show('บันทึก...');
      call('auth.updateProfile', payload).then(function (u) {
        Spinner.hide();
        Store.user = u;
        var sess = JSON.parse(localStorage.getItem('css.session') || '{}');
        sess.user = u;
        localStorage.setItem('css.session', JSON.stringify(sess));
        toast('บันทึกเรียบร้อย', 'success');
        // re-render shell to update avatar
        renderShell();
      }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); });
    });
  }

  // ── Init ──────────────────────────────────────────────────
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
