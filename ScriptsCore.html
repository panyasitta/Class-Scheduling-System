<script type="text/x-css-core" id="lpss-core-script">
/* ═══════════════════════════════════════════════════════════
   CSS · Class Scheduling System — SPA Core
   ═══════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  // ── DOM helpers ────────────────────────────────────────────
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function el(tag, attrs, html) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'style') n.style.cssText = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    if (html !== undefined) n.innerHTML = html;
    return n;
  }
  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ── Thai date module ──────────────────────────────────────
  var TH = {
    MONTHS:        ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'],
    MONTHS_SHORT:  ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],
    WEEKDAYS:      ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'],
    WEEKDAYS_SHORT:['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'],
    pad_: function (n) { return n < 10 ? '0' + n : '' + n; },
    parse: function (v) {
      if (!v) return null;
      if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
      try { var d = new Date(v); return isNaN(d.getTime()) ? null : d; } catch (e) { return null; }
    },
    beYear: function (d) { return d.getFullYear() + 543; },
    date: function (v) {
      var d = TH.parse(v); if (!d) return v ? String(v) : '-';
      return d.getDate() + ' ' + TH.MONTHS_SHORT[d.getMonth()] + ' ' + TH.beYear(d);
    },
    dateLong: function (v) {
      var d = TH.parse(v); if (!d) return v ? String(v) : '-';
      return d.getDate() + ' ' + TH.MONTHS[d.getMonth()] + ' ' + TH.beYear(d);
    },
    dateWeekday: function (v) {
      var d = TH.parse(v); if (!d) return v ? String(v) : '-';
      return TH.WEEKDAYS_SHORT[d.getDay()] + ' ' + d.getDate() + ' ' + TH.MONTHS_SHORT[d.getMonth()] + ' ' + TH.beYear(d);
    },
    dateLongWeekday: function (v) {
      var d = TH.parse(v); if (!d) return v ? String(v) : '-';
      return 'วัน' + TH.WEEKDAYS[d.getDay()] + 'ที่ ' + d.getDate() + ' ' + TH.MONTHS[d.getMonth()] + ' ' + TH.beYear(d);
    },
    time: function (v) {
      var d = TH.parse(v); if (!d) return '';
      return TH.pad_(d.getHours()) + ':' + TH.pad_(d.getMinutes()) + ' น.';
    },
    dateTime: function (v) {
      var d = TH.parse(v); if (!d) return v ? String(v) : '-';
      return TH.date(d) + ' เวลา ' + TH.time(d);
    },
    relative: function (v) {
      var d = TH.parse(v); if (!d) return '-';
      var diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 60) return 'เมื่อสักครู่';
      if (diff < 3600) return Math.floor(diff/60) + ' นาทีที่แล้ว';
      if (diff < 86400) return Math.floor(diff/3600) + ' ชั่วโมงที่แล้ว';
      if (diff < 86400*7) return Math.floor(diff/86400) + ' วันที่แล้ว';
      return TH.date(d);
    },
    smart: function (v) {
      var d = TH.parse(v); if (!d) return '-';
      var diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 86400*7) return TH.relative(d);
      return TH.dateTime(d);
    },
    iso: function (v) {
      var d = TH.parse(v); if (!d) return '';
      return d.getFullYear() + '-' + TH.pad_(d.getMonth()+1) + '-' + TH.pad_(d.getDate());
    }
  };

  // ── Store ──────────────────────────────────────────────────
  var Store = {
    boot: null,
    user: null,
    token: null,
    caps: [],
    masters: null,
    settings: null
  };

  function loadSession_() {
    try {
      var raw = localStorage.getItem('css.session');
      if (raw) {
        var s = JSON.parse(raw);
        Store.user = s.user; Store.token = s.token; Store.caps = s.caps || [];
      }
    } catch (e) {}
  }
  function saveSession_(payload) {
    Store.user = payload.user; Store.token = payload.token; Store.caps = payload.caps || [];
    localStorage.setItem('css.session', JSON.stringify({ user: payload.user, token: payload.token, caps: payload.caps }));
  }
  function clearSession_() {
    Store.user = null; Store.token = null; Store.caps = [];
    Store.masters = null; Store.settings = null;
    localStorage.removeItem('css.session');
  }

  function hasCap(cap) {
    if (!cap || cap === '*') return true;
    var caps = Store.caps || [];
    return cap.split('|').some(function (c) {
      if (caps.indexOf(c) >= 0) return true;
      if (/\.(view_own|view_self|edit_own|edit_self)$/.test(c)) return false;
      var dot = c.indexOf('.');
      if (dot > 0) {
        var prefix = c.substring(0, dot);
        if (caps.indexOf(prefix + '.manage') >= 0) return true;
      }
      return false;
    });
  }

  function canSeeMenu(item) {
    if (item.roles && item.roles.indexOf(Store.user ? Store.user.role : '') < 0) return false;
    return hasCap(item.cap || '*');
  }

  // ── API ────────────────────────────────────────────────────
  function call(action, payload) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (r) {
          if (!r) return reject(new Error('No response'));
          if (r.ok) return resolve(r.data);
          reject(new Error(r.error || 'Error'));
        })
        .withFailureHandler(function (e) { reject(new Error(String(e && e.message || e))); })
        .api(action, payload || {}, Store.token);
    });
  }

  // ── Toast / Modal / Spinner ───────────────────────────────
  function toast(msg, type, dur) {
    var host = $('#toast-host'); if (!host) return;
    var t = el('div', { class: 'toast ' + (type || 'info') });
    var icon = type === 'success' ? 'bi-check-circle-fill'
             : type === 'warning' ? 'bi-exclamation-triangle-fill'
             : type === 'error'   ? 'bi-x-circle-fill'
             :                      'bi-info-circle-fill';
    t.innerHTML = '<i class="bi ' + icon + '"></i><span>' + esc(msg) + '</span>';
    host.appendChild(t);
    setTimeout(function () {
      t.classList.add('out');
      setTimeout(function () { t.remove(); }, 300);
    }, dur || 3000);
  }

  var Spinner = {
    show: function (text) {
      var ov = $('#spinner-overlay');
      if (!ov) return;
      var t = ov.querySelector('.spinner-text');
      if (t) t.textContent = text || 'กำลังประมวลผล…';
      ov.removeAttribute('hidden');
    },
    hide: function () {
      var ov = $('#spinner-overlay');
      if (ov) ov.setAttribute('hidden', '');
    }
  };

  var Modal = {
    open: function (opts) {
      Modal.close();
      var bd = el('div', { class: 'modal-backdrop' });
      var card = el('div', { class: 'modal-card ' + (opts.size === 'large' ? 'large' : opts.size === 'xlarge' ? 'xlarge' : '') });
      var html = '';
      if (opts.title) {
        html += '<div class="md-header"><div class="md-title">' + esc(opts.title) + '</div>'
              + '<button class="md-close" data-action="close"><i class="bi bi-x"></i></button></div>';
      }
      html += '<div class="md-body">' + (opts.html || '') + '</div>';
      if (opts.footer) html += '<div class="md-footer">' + opts.footer + '</div>';
      card.innerHTML = html;
      bd.appendChild(card);
      $('#modal-host').appendChild(bd);
      bd.addEventListener('click', function (e) {
        if (e.target === bd) Modal.close();
      });
      var btnClose = card.querySelector('[data-action="close"]');
      if (btnClose) btnClose.addEventListener('click', Modal.close);
      if (opts.onOpen) try { opts.onOpen(card); } catch (e) {}
      return card;
    },
    close: function () {
      var host = $('#modal-host');
      if (host) host.innerHTML = '';
    }
  };

  function confirmModal(opts) {
    return new Promise(function (resolve) {
      var html = ''
        + '<div style="text-align:center;padding:8px 0">'
        + '<div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,' + (opts.color || '#f59e0b') + ',' + (opts.color2 || '#d97706') + ');display:flex;align-items:center;justify-content:center;margin:0 auto 14px">'
        + '<i class="bi ' + (opts.icon || 'bi-exclamation-triangle-fill') + '" style="color:white;font-size:28px"></i></div>'
        + '<div style="font-size:16px;font-weight:700;margin-bottom:6px">' + esc(opts.title || 'ยืนยัน?') + '</div>'
        + (opts.message ? '<div style="font-size:13px;color:var(--ink-muted)">' + esc(opts.message) + '</div>' : '')
        + '</div>';
      var footer = ''
        + '<button class="btn" data-act="cancel">ยกเลิก</button>'
        + '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-act="ok">' + esc(opts.okText || 'ยืนยัน') + '</button>';
      var card = Modal.open({
        title: opts.title || 'ยืนยัน', html: html, footer: footer,
        onOpen: function (c) {
          c.querySelector('[data-act="cancel"]').addEventListener('click', function () { Modal.close(); resolve(false); });
          c.querySelector('[data-act="ok"]').addEventListener('click', function () { Modal.close(); resolve(true); });
        }
      });
    });
  }

  // ── Boot ──────────────────────────────────────────────────
  function boot() {
    loadSession_();
    call('app.boot').then(function (b) {
      Store.boot = b;
      hideBootLoader();
      if (Store.token && Store.user) {
        // verify
        call('auth.me').then(function (r) {
          Store.user = r.user; Store.caps = r.caps;
          renderShell();
        }).catch(function () {
          clearSession_();
          renderLogin();
        });
      } else {
        renderLogin();
      }
    }).catch(function (e) {
      hideBootLoader();
      document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#ef4444"><h2>เกิดข้อผิดพลาด</h2><p>' + esc(e.message) + '</p><p style="color:#64748b;font-size:13px;margin-top:14px">กรุณาเปิด Spreadsheet → เมนู "🏫 ระบบจัดตารางเรียน" → "🔐 ขออนุญาตสิทธิ์ระบบ"</p></div>';
    });
  }

  function hideBootLoader() {
    var b = $('#boot-loader');
    if (b) b.style.display = 'none';
    var app = $('#app');
    if (app) app.removeAttribute('hidden');
  }

  // ── Login ─────────────────────────────────────────────────
  function renderLogin() {
    var b = Store.boot || {};
    var dev = b.dev || {};
    var year = new Date().getFullYear();
    var demoCards = b.show_demo ? demoUsersHtml() : '';
    // Pre-build features HTML to avoid string-concat leak trap (`+ + fn()` = unary plus = NaN)
    var featuresHtml = loginFeatureHtml('bi-calendar2-check', '#10b981,#059669', 'ตารางเรียนสวยงาม', 'ดูตารางครู/ห้อง/ชั้น สลับมุมมองในคลิกเดียว')
      + loginFeatureHtml('bi-magic', '#8b5cf6,#6d28d9', 'หาครูสอนแทนใน 1 คลิก', 'ระบบหาครูที่ว่างและเหมาะสม จัดให้อัตโนมัติ')
      + loginFeatureHtml('bi-shield-check', '#3b82f6,#1d4ed8', 'ตรวจชนกันทันที', 'กันคาบซ้อน ครูซ้อน ห้องซ้อนตั้งแต่บันทึก')
      + loginFeatureHtml('bi-graph-up-arrow', '#f59e0b,#d97706', 'รายงานสมบูรณ์', 'สถิติการลา การสอนแทน รายบุคคล/ภาพรวม');
    var html = ''
    + '<div class="login-stage">'
    +   '<div class="login-shell">'
    +     '<div class="login-brand">'
    +       '<div class="login-brand-top">'
    +         '<div class="login-logo"><i class="bi bi-calendar3-week"></i></div>'
    +         '<div><div class="login-app-name">' + esc(b.app ? b.app.name : 'ระบบจัดตารางเรียน') + '</div>'
    +         '<div class="login-app-sub">Class Scheduling System</div></div>'
    +       '</div>'
    +       '<div class="login-tagline">จัดตารางเรียน <span class="shine">อัจฉริยะ</span><br>+ ครูสอนแทนอัตโนมัติ</div>'
    +       '<div class="login-features">' + featuresHtml + '</div>'
    +     '</div>'
    +     '<div class="login-form-wrap">'
    +       '<div class="login-mobile-brand">'
    +         '<div class="login-logo"><i class="bi bi-calendar3-week"></i></div>'
    +         '<div><div class="login-app-name">' + esc(b.app ? b.app.name : '') + '</div></div>'
    +       '</div>'
    +       '<div>'
    +         '<div class="login-form-title">ยินดีต้อนรับกลับ</div>'
    +         '<div class="login-form-sub">เข้าสู่ระบบเพื่อจัดการตารางเรียน</div>'
    +       '</div>'
    +       '<form class="lf" id="login-form" novalidate>'
    +         '<div class="lf-input-wrap">'
    +           '<i class="bi bi-person-fill lf-icon"></i>'
    +           '<input class="lf-input" name="username" type="text" placeholder="ชื่อผู้ใช้" autocomplete="username" spellcheck="false">'
    +         '</div>'
    +         '<div class="lf-input-wrap">'
    +           '<i class="bi bi-lock-fill lf-icon"></i>'
    +           '<input class="lf-input" name="password" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">'
    +           '<button class="lf-toggle" type="button" tabindex="-1" data-toggle-pass><i class="bi bi-eye-fill"></i></button>'
    +         '</div>'
    +         '<div class="lf-row">'
    +           '<label class="lf-check"><input type="checkbox" name="remember"><span class="lf-check-box"></span><span>จดจำฉันไว้</span></label>'
    +         '</div>'
    +         submitButtonHtml('เข้าสู่ระบบ', 'bi-box-arrow-in-right')
    +       '</form>'
    +       demoCards
    +     '</div>'
    +   '</div>'
    +   loginFooterHtml(year, b)
    + '</div>';
    $('#app').innerHTML = html;
    wireLogin();
    wireDevFooter();
  }

  function loginFeatureHtml(icon, grad, title, desc) {
    var parts = grad.split(',');
    return ''
    + '<div class="login-feature">'
    +   '<div class="login-feature-icon" style="background:linear-gradient(135deg,' + parts[0] + ',' + parts[1] + ')"><i class="bi ' + icon + '"></i></div>'
    +   '<div class="login-feature-text"><div class="login-feature-title">' + esc(title) + '</div>'
    +   '<div class="login-feature-desc">' + esc(desc) + '</div></div>'
    + '</div>';
  }

  function submitButtonHtml(label, icon) {
    return ''
    + '<button class="lf-submit" type="submit">'
    +   '<span class="lf-submit-state lf-submit-state-default"><i class="bi ' + icon + '"></i> ' + esc(label) + '</span>'
    +   '<span class="lf-submit-state lf-submit-state-loading">'
    +     '<span class="lf-droplets"><span></span><span></span><span></span></span>'
    +     '<span class="lf-submit-status">กำลังตรวจสอบข้อมูล...</span>'
    +   '</span>'
    +   '<span class="lf-submit-state lf-submit-state-success"><i class="bi bi-check-circle-fill"></i><span>เข้าสู่ระบบสำเร็จ!</span></span>'
    +   '<span class="lf-submit-state lf-submit-state-error"><i class="bi bi-exclamation-triangle-fill"></i><span>เข้าสู่ระบบไม่สำเร็จ</span></span>'
    + '</button>';
  }

  function demoUsersHtml() {
    var users = [
      { role: 'admin',    name: 'ผู้ดูแล',    user: 'admin' },
      { role: 'academic', name: 'วิชาการ',    user: 'academic' },
      { role: 'head',     name: 'หัวหน้า',    user: 'head_math' },
      { role: 'teacher',  name: 'ครู',        user: 'teacher1' }
    ];
    var icons = { admin: 'bi-shield-check', academic: 'bi-clipboard-data', head: 'bi-people-fill', teacher: 'bi-person-workspace' };
    var cards = users.map(function (u) {
      return '<button type="button" class="lf-demo-card" data-role="' + u.role + '" data-user="' + esc(u.user) + '" aria-label="เข้าสู่ระบบด้วยบัญชี ' + esc(u.name) + '">'
        + '<div class="lf-demo-icon"><i class="bi ' + icons[u.role] + '"></i></div>'
        + '<div class="lf-demo-role">' + esc(u.name) + '</div>'
        + '<div class="lf-demo-user">' + esc(u.user) + '</div>'
        + '</button>';
    }).join('');
    return ''
    + '<div class="lf-demo">'
    +   '<div class="lf-demo-header"><span><i class="bi bi-stars"></i> ทดลองใช้บัญชีตัวอย่าง</span><span class="lf-demo-pill">DEMO</span></div>'
    +   '<div class="lf-demo-grid">' + cards + '</div>'
    +   '<div class="lf-demo-foot"><i class="bi bi-cursor-fill"></i> คลิกการ์ดเพื่อเข้าสู่ระบบทันที (รหัสผ่าน: <strong>123456</strong>)</div>'
    + '</div>';
  }

  function loginFooterHtml(year, b) {
    var dev = b.dev || {};
    var devLink = String(dev.URL || '').replace(/^https?:\/\//, '').replace(/\/$/, '') || '-';
    return ''
    + '<div class="login-footer">'
    +   '<div class="lf-copy">' + year + ' © ' + esc(b.app ? b.app.name : '') + ' <span class="lf-version">v' + esc(b.app ? b.app.version : '') + '</span></div>'
    +   '<div class="lf-dev">'
    +     '<a href="' + esc(dev.URL) + '" target="_blank" rel="noopener noreferrer" class="lf-dev-link">'
    +       '<img class="lf-dev-logo dev-logo-img" src="' + esc(dev.LOGO) + '" alt="' + esc(dev.NAME) + '" referrerpolicy="no-referrer">'
    +     '</a>'
    +     '<div class="lf-dev-text"><small>ผู้พัฒนาโดย</small><br>'
    +       '<a href="' + esc(dev.URL) + '" target="_blank" rel="noopener noreferrer">' + esc(devLink) + '</a>'
    +     '</div>'
    +   '</div>'
    + '</div>';
  }

  function wireLogin() {
    var f = $('#login-form');
    if (!f) return;
    var pass = f.querySelector('input[name="password"]');
    var togglePass = f.querySelector('[data-toggle-pass]');
    if (togglePass) togglePass.addEventListener('click', function () {
      var icon = togglePass.querySelector('i');
      if (pass.type === 'password') { pass.type = 'text'; icon.className = 'bi bi-eye-slash-fill'; }
      else { pass.type = 'password'; icon.className = 'bi bi-eye-fill'; }
    });
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      doLogin(f.username.value, pass.value);
    });
    $$('.lf-demo-card').forEach(function (c) {
      c.addEventListener('click', function () {
        f.username.value = c.getAttribute('data-user');
        pass.value = '123456';
        try { if (typeof f.requestSubmit === 'function') f.requestSubmit(); else f.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true })); } catch (e) {}
      });
    });
    var first = f.querySelector('input[name="username"]');
    if (first) try { first.focus(); } catch (e) {}
  }

  function doLogin(username, password) {
    var btn = $('.lf-submit');
    if (btn) btn.setAttribute('data-state', 'loading');
    var stages = ['กำลังตรวจสอบข้อมูล...', 'ยืนยันตัวตน...', 'เตรียมระบบ...'];
    var idx = 0;
    var statusEl = btn ? btn.querySelector('.lf-submit-status') : null;
    if (statusEl) statusEl.textContent = stages[0];
    var stageTimer = setInterval(function () {
      idx = (idx + 1) % stages.length;
      if (statusEl) statusEl.textContent = stages[idx];
    }, 700);
    call('auth.login', { username: username, password: password }).then(function (r) {
      clearInterval(stageTimer);
      if (btn) btn.setAttribute('data-state', 'success');
      saveSession_(r);
      setTimeout(function () { renderShell(); }, 700);
    }).catch(function (e) {
      clearInterval(stageTimer);
      if (btn) btn.setAttribute('data-state', 'error');
      toast(e.message || 'เข้าสู่ระบบไม่สำเร็จ', 'error');
      setTimeout(function () { if (btn) btn.removeAttribute('data-state'); }, 1600);
    });
  }

  function wireDevFooter() {
    $$('.dev-logo-img').forEach(function (img) {
      if (img.__wired) return;
      img.__wired = true;
      img.addEventListener('error', function () { img.style.display = 'none'; }, { once: true });
    });
  }

  // ── Page meta + Menu ──────────────────────────────────────
  var PAGE_META = {
    '#/dashboard':    { title: 'แดชบอร์ด', sub: 'ภาพรวมระบบและสถิติ', icon: 'bi-speedometer2' },
    '#/schedule':     { title: 'ตารางเรียน', sub: 'จัดและดูตารางสอน', icon: 'bi-calendar3-week' },
    '#/absences':     { title: 'การลา', sub: 'แจ้งลาและอนุมัติการลา', icon: 'bi-calendar-x' },
    '#/substitutes':  { title: 'ครูสอนแทน', sub: 'จัดและดูการสอนแทน', icon: 'bi-people-fill' },

  function wireShell() {
    document.addEventListener('click', function (e) {
      var burger = e.target.closest && e.target.closest('#nav-burger');
      if (burger) {
        var sb = $('#sidebar'), bd = $('#sb-backdrop');
        sb.classList.toggle('open');
        bd.classList.toggle('show');
        return;
      }
      var bd = e.target.closest && e.target.closest('#sb-backdrop');
      if (bd) {
        $('#sidebar').classList.remove('open');
        $('#sb-backdrop').classList.remove('show');
        return;
      }
      var profileBtn = e.target.closest && e.target.closest('#nav-profile-btn');
      if (profileBtn) {
        var pop = $('#nav-profile-pop');
        if (pop.hasAttribute('hidden')) pop.removeAttribute('hidden');
        else pop.setAttribute('hidden', '');
        return;
      }
      // close popover when clicking outside
      var pop = $('#nav-profile-pop');
      if (pop && !pop.hasAttribute('hidden') && !e.target.closest('.nav-profile')) {
        pop.setAttribute('hidden', '');
      }
      // logout
      var logoutBtn = e.target.closest && e.target.closest('[data-action="logout"]');
      if (logoutBtn) {
        e.preventDefault();
        confirmModal({
          title: 'ออกจากระบบ?', message: 'คุณต้องการออกจากระบบใช่หรือไม่',
          icon: 'bi-box-arrow-right', danger: true, okText: 'ออกจากระบบ'
        }).then(function (yes) { if (yes) doLogout(); });
        return;
      }
      // change password
      var cpBtn = e.target.closest && e.target.closest('[data-action="change-password"]');
      if (cpBtn) {
        e.preventDefault();
        var pop = $('#nav-profile-pop'); if (pop) pop.setAttribute('hidden', '');
        openChangePasswordModal();
        return;
      }
      // hash link interception
      var a = e.target.closest && e.target.closest('a[href]');
      if (a) {
        var href = a.getAttribute('href');
        if (href && href.charAt(0) === '#') {
          e.preventDefault();
          if (href === location.hash) dispatch();
          else location.hash = href;
          // close sidebar on mobile
          $('#sidebar').classList.remove('open');
          $('#sb-backdrop').classList.remove('show');
        }
      }
      // bottom nav
      var bn = e.target.closest && e.target.closest('.bn-item');
      if (bn) {
        var h = bn.getAttribute('data-hash');
        if (h === 'menu') {
          e.preventDefault();
          $('#sidebar').classList.add('open');
          $('#sb-backdrop').classList.add('show');
          return;
        }
        if (h && h.charAt(0) === '#') {
          e.preventDefault();
          if (h === location.hash) dispatch(); else location.hash = h;
        }
      }
      // data-hash link
      var dh = e.target.closest && e.target.closest('[data-hash]');
      if (dh && !dh.matches('.bn-item')) {
        var h = dh.getAttribute('data-hash');
        if (h && h.charAt(0) === '#') {
          e.preventDefault();
          if (h === location.hash) dispatch(); else location.hash = h;
        }
      }
    }, true);
    window.addEventListener('hashchange', dispatch);
  }

  function startClock() {
    if (window.__cssClockTimer) clearInterval(window.__cssClockTimer);
    function tick() {
      var now = new Date();
      var t = TH.pad_(now.getHours()) + ':' + TH.pad_(now.getMinutes()) + ':' + TH.pad_(now.getSeconds());
      var sb = $('#sb-clock-time'); if (sb) sb.textContent = t;
      var sbd = $('#sb-clock-date'); if (sbd) sbd.textContent = TH.dateLongWeekday(now);
      var nv = $('#nav-clock'); if (nv) nv.textContent = TH.dateWeekday(now) + ' · ' + t.slice(0,5) + ' น.';
    }
    tick();
    window.__cssClockTimer = setInterval(tick, 1000);
  }

          if (n !== n2) return toast('รหัสผ่านใหม่ไม่ตรงกัน', 'warning');

  // ── Router / Dispatch ─────────────────────────────────────
  function dispatch() {
    if (!document.getElementById('page')) return;
    if (!Store.token || !Store.user) return;
    var hash = location.hash || '#/dashboard';
    var meta = PAGE_META[hash] || { title: 'ไม่พบหน้า', sub: '', icon: 'bi-question-circle' };
    var nav = $('#navbar'); if (nav) nav.innerHTML = navbarRender(meta);
    // active sidebar
    $$('.sb-link').forEach(function (a) {
      a.classList.toggle('is-active', a.getAttribute('data-hash') === hash);
    });
    $$('.bn-item').forEach(function (a) {
      a.classList.toggle('is-active', a.getAttribute('data-hash') === hash);
    });
    var page = $('#page');
    if (!page) return;
    page.innerHTML = '<div class="hero" style="height:120px;background:linear-gradient(135deg,#e2e8f0,#cbd5e1)"></div><div class="panel"><div class="skeleton" style="height:18px;width:60%"></div><div class="skeleton" style="height:14px;width:40%;margin-top:10px"></div></div>';
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
    var fn = ROUTES_PAGE[hash];
    if (fn) fn(); else page.innerHTML = '<div class="empty-state"><i class="bi bi-exclamation-circle"></i><p>ไม่พบหน้านี้</p></div>';
  }

    if (!arr || !id) return null;
    for (var i = 0; i < arr.length; i++) if (String(arr[i].id) === String(id)) return arr[i];
    return null;
  }

  function manualStepsHtml(steps) {
    var rows = steps.map(function (s) {
      return '<div class="um-step">'
        + '<div class="um-step-num"></div>'
        + '<div class="um-step-body">'
        +   '<div class="um-step-title"><i class="bi ' + esc(s.i) + '"></i> ' + esc(s.t) + '</div>'
        +   '<div class="um-step-desc">' + s.d + '</div>'
        +   (s.tip ? '<div class="um-step-tip"><i class="bi bi-lightbulb-fill"></i> <span>' + s.tip + '</span></div>' : '')
        + '</div>'
        + '</div>';
    }).join('');
    return '<div class="um-steps">' + rows + '</div>';
  }

  function wireUserManual() {
    var root = document.querySelector('.um');
    if (!root) return;
    var tabs = root.querySelectorAll('[data-um-tab]');
    var panes = root.querySelectorAll('[data-um-pane]');
    tabs.forEach(function (t) {
      t.addEventListener('click', function () {
        var key = t.getAttribute('data-um-tab');
        tabs.forEach(function (x) { x.classList.toggle('is-active', x === t); });
        panes.forEach(function (p) {
          if (p.getAttribute('data-um-pane') === key) p.removeAttribute('hidden');
          else p.setAttribute('hidden', '');
        });
      });
    });
  }

  function trendChartHtml(trend) {
    if (!trend || !trend.length) return '<div class="empty-state"><i class="bi bi-graph-up"></i><p>ไม่มีข้อมูล</p></div>';
    var w = 600, h = 220, pad = 30;
    var maxVal = Math.max(1, Math.max.apply(null, trend.map(function (t) { return Math.max(t.absences, t.substitutes); })));
    var n = trend.length;
    var stepX = (w - pad * 2) / Math.max(1, n - 1);
    function pt(i, v) {
      return [pad + i * stepX, h - pad - (v / maxVal) * (h - pad * 2)];
    }
    var path1 = trend.map(function (t, i) { var p = pt(i, t.absences); return (i ? 'L' : 'M') + p[0] + ',' + p[1]; }).join(' ');
    var path2 = trend.map(function (t, i) { var p = pt(i, t.substitutes); return (i ? 'L' : 'M') + p[0] + ',' + p[1]; }).join(' ');
    var areaPath = path1 + ' L' + (pad + (n-1)*stepX) + ',' + (h-pad) + ' L' + pad + ',' + (h-pad) + ' Z';
    var dots1 = trend.map(function (t, i) { var p = pt(i, t.absences); return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="#ef4444"/>'; }).join('');
    var dots2 = trend.map(function (t, i) { var p = pt(i, t.substitutes); return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="#3b82f6"/>'; }).join('');
    var labels = trend.map(function (t, i) {
      if (i % 2) return '';
      var p = pt(i, 0);
      var d = TH.parse(t.date);
      var lbl = d ? (d.getDate() + '/' + (d.getMonth()+1)) : '';
      return '<text x="' + p[0] + '" y="' + (h - 8) + '" text-anchor="middle" font-size="10" fill="#94a3b8">' + lbl + '</text>';
    }).join('');
    return ''
    + '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet" width="100%" height="220">'
    +   '<defs><linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef4444" stop-opacity=".25"/><stop offset="100%" stop-color="#ef4444" stop-opacity="0"/></linearGradient></defs>'
    +   '<path d="' + areaPath + '" fill="url(#grad1)"/>'
    +   '<path d="' + path1 + '" stroke="#ef4444" stroke-width="2" fill="none"/>'
    +   '<path d="' + path2 + '" stroke="#3b82f6" stroke-width="2" fill="none" stroke-dasharray="4,2"/>'
    +   dots1 + dots2 + labels
    + '</svg>'
    + '<div style="display:flex;gap:14px;justify-content:center;margin-top:6px;font-size:11px">'
    +   '<span><i class="bi bi-circle-fill" style="color:#ef4444"></i> ลา</span>'
    +   '<span><i class="bi bi-circle-fill" style="color:#3b82f6"></i> สอนแทน</span>'
    + '</div>';
  }

  function topListHtml(items, key, unit) {
    if (!items || !items.length) return '<div class="empty-state"><i class="bi bi-inbox"></i><p>ไม่มีข้อมูล</p></div>';
    return items.map(function (it, idx) {
      var medal = idx === 0 ? 'linear-gradient(135deg,#fcd34d,#f59e0b)' : idx === 1 ? 'linear-gradient(135deg,#e5e7eb,#9ca3af)' : idx === 2 ? 'linear-gradient(135deg,#fbbf24,#b45309)' : '#94a3b8';
      var medalText = idx + 1;
      return '<div style="display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid var(--line)">'
        + '<div style="width:30px;height:30px;border-radius:50%;background:' + medal + ';display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:12px">' + medalText + '</div>'
        + '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">' + esc(it.full_name) + '</div>'
        + '<div style="font-size:11px;color:var(--ink-muted)">' + esc(it.subject_group || '-') + '</div></div>'
        + '<div style="background:var(--brand-soft);color:var(--brand-1);font-weight:700;padding:4px 10px;border-radius:8px;font-size:13px">' + esc(it[key]) + ' ' + esc(unit) + '</div>'
        + '</div>';
    }).join('');
  }

  // ═══════════════════════════════════════════════════════
  //   SCHEDULE PRO EDITION — DnD + Mobile + Filters + FAB
  // ═══════════════════════════════════════════════════════
  var SCHED_STATE = {
    view: 'class',
    target_id: '',
    term: '1',
    year: '',
    compact: false,
    filterGroup: '',
    searchQuery: '',
    selectedDay: 0,        // 0 = all days, 1-5 = single day mobile
    hideHint: false,
    lastData: null,
    highlightedTeacher: null,
    selectedCells: []      // bulk select
  };

  function pageSchedule() {
    loadMasters().then(function (m) {
      if (!SCHED_STATE.target_id && m.classes.length) SCHED_STATE.target_id = m.classes[0].id;
      if (!SCHED_STATE.year) SCHED_STATE.year = String(new Date().getFullYear() + 543);
      if (Store.user.role === 'teacher' && SCHED_STATE.view === 'class') {
        SCHED_STATE.view = 'teacher';
        SCHED_STATE.target_id = Store.user.id;
      }
      // restore prefs
      try {
        SCHED_STATE.compact = localStorage.getItem('css.sched.compact') === '1';
        SCHED_STATE.hideHint = localStorage.getItem('css.sched.hideHint') === '1';
      } catch (e) {}
      // default selected day = today (if weekday)
      var dow = new Date().getDay();
      if (dow >= 1 && dow <= 5 && !SCHED_STATE.selectedDay) SCHED_STATE.selectedDay = dow;
      if (!SCHED_STATE.selectedDay) SCHED_STATE.selectedDay = 1;
      renderSchedulePage(m);
    });
  }

  function renderSchedulePage(m) {
    var canManage = hasCap('schedule.manage');
    var groups = (Store.boot.subject_groups || []);
    // hero KPI placeholder (will fill after grid loads)
    var html = ''
    + '<div class="hero">'
    +   '<span class="hero-pill"><i class="bi bi-calendar3-week"></i> ตารางเรียน Pro</span>'
    +   '<div class="hero-title">ตารางสอน · ' + esc(SCHED_STATE.term) + '/' + esc(SCHED_STATE.year) + '</div>'
    +   '<div class="hero-sub">' + (canManage ? 'ลากการ์ดเพื่อย้ายคาบ · คลิกเซลล์ว่างเพื่อเพิ่ม · คลิกการ์ดเพื่อแก้ไข' : 'ดูตารางสอน เลือกมุมมองตามชั้น/ครู/ห้อง') + '</div>'
    +   '<div class="hero-kpi" id="sc-kpi">'
    +     kpiCardHtml('bi-calendar3-week', 'จำนวนคาบ', '—', '')
    +     kpiCardHtml('bi-people-fill', 'ครูที่สอน', '—', '')
    +     kpiCardHtml('bi-door-open', 'ห้องที่ใช้', '—', '')
    +     kpiCardHtml('bi-grid-3x3', 'ชั้นที่เรียน', '—', '')
    +   '</div>'
    + '</div>';
    // hint banner
    if (canManage && !SCHED_STATE.hideHint) {
      html += '<div class="sched-hint">'
        + '<i class="bi bi-lightbulb-fill"></i>'
        + '<span><b>เคล็ดลับ:</b> ลากการ์ดวิชาไปวางในเซลล์ว่างเพื่อย้ายคาบ · ลากไปวางทับคาบอื่น = สลับ</span>'
        + '<button id="sc-hint-close" aria-label="ปิด"><i class="bi bi-x"></i></button>'
        + '</div>';
    }
    // panel with toolbar + grid
    html += '<div class="panel">'
      // ── Mode toggle (view: class/teacher/room) ──
      + '<div class="sched-toolbar">'
      +   '<div class="sched-mode-toggle">'
      +     '<button data-view="class"' + (SCHED_STATE.view === 'class' ? ' class="is-active"' : '') + '><i class="bi bi-grid-3x3"></i><span class="always"> ชั้น</span></button>'
      +     '<button data-view="teacher"' + (SCHED_STATE.view === 'teacher' ? ' class="is-active"' : '') + '><i class="bi bi-person-badge"></i><span class="always"> ครู</span></button>'
      +     '<button data-view="room"' + (SCHED_STATE.view === 'room' ? ' class="is-active"' : '') + '><i class="bi bi-door-open"></i><span class="always"> ห้อง</span></button>'
      +   '</div>'
      +   '<select class="select" id="sc-target" style="min-width:160px;flex:1;max-width:220px"></select>'
      +   '<div class="sched-search-wrap"><i class="bi bi-search"></i>'
      +     '<input id="sc-search" placeholder="ค้นหา ครู/วิชา/ห้อง..." value="' + esc(SCHED_STATE.searchQuery) + '">'
      +     '<button class="sched-search-clear" id="sc-search-clear"><i class="bi bi-x-circle-fill"></i></button>'
      +   '</div>'
      +   '<button class="sched-app-btn" id="sc-compact" title="โหมดกะทัดรัด"><i class="bi ' + (SCHED_STATE.compact ? 'bi-arrows-angle-contract' : 'bi-arrows-angle-expand') + '"></i><span> ' + (SCHED_STATE.compact ? 'ขยาย' : 'กะทัดรัด') + '</span></button>'
      +   '<button class="sched-app-btn is-icon" id="sc-refresh" title="รีเฟรช"><i class="bi bi-arrow-clockwise"></i></button>'
      +   '<button class="sched-app-btn is-icon" id="sc-print" title="พิมพ์"><i class="bi bi-printer"></i></button>'
      +   '<button class="sched-app-btn is-icon" id="sc-export" title="ส่งออก CSV"><i class="bi bi-download"></i></button>'
      +   (canManage ? '<button class="sched-app-btn btn-magic" id="sc-magic" title="จัดตารางอัตโนมัติด้วย AI"><i class="bi bi-stars"></i><span> AI จัด</span></button>' : '')
      +   (canManage ? '<button class="sched-app-btn is-primary" id="sc-add"><i class="bi bi-plus-lg"></i><span> เพิ่ม</span></button>' : '')
      + '</div>'
      // ── Group filter chips ──
      + '<div class="sched-group-chips" id="sc-group-chips">'
      +   '<button class="sched-group-chip' + (!SCHED_STATE.filterGroup ? ' is-active' : '') + '" data-group="" style="' + (!SCHED_STATE.filterGroup ? 'background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white' : '') + '">'
      +     '<i class="bi bi-grid"></i><span> ทั้งหมด</span>'
      +     '<span class="sched-group-chip-count" id="sc-count-all">0</span>'
      +   '</button>'
      +   groups.map(function (g) {
            var active = SCHED_STATE.filterGroup === g.key;
            return '<button class="sched-group-chip' + (active ? ' is-active' : '') + '" data-group="' + esc(g.key) + '"'
              + (active ? ' style="background:' + esc(g.color) + '"' : '') + '>'
              + '<span class="sched-group-chip-dot" style="background:' + esc(g.color) + '"></span>'
              + '<span>' + esc(g.label) + '</span>'
              + '<span class="sched-group-chip-count" data-count-group="' + esc(g.key) + '">0</span>'
              + '</button>';
          }).join('')
      + '</div>'
      // ── Day swiper (mobile only) ──
      + dayPickerHtml()
      // ── Stats mini-bar ──
      + '<div class="sched-stats" id="sc-stats" hidden></div>'
      // ── Grid ──
      + '<div id="sc-grid"><div class="skeleton" style="height:280px;border-radius:12px"></div></div>'
      + '</div>';
    // FAB
    if (canManage) html += '<button class="sched-fab" id="sc-fab" aria-label="เพิ่มคาบ"><i class="bi bi-plus-lg"></i></button>';
    $('#page').innerHTML = html;
    populateScheduleTarget(m);
    loadScheduleGrid();
    wireScheduleToolbar(m);
  }

  function dayPickerHtml() {
    var days = Store.boot.days || [];
    var todayDow = new Date().getDay();
    var html = '<div class="sched-day-swiper" id="sc-day-swiper">';
    html += '<button class="sched-day-tab' + (SCHED_STATE.selectedDay === 0 ? ' is-active' : '') + '" data-day="0">'
      + '<span class="sdt-name">ทั้ง</span><span class="sdt-num"><i class="bi bi-grid"></i></span><span class="sdt-name">สัปดาห์</span></button>';
    days.forEach(function (d) {
      var isToday = todayDow === d.id;
      var active = SCHED_STATE.selectedDay === d.id;
      html += '<button class="sched-day-tab' + (active ? ' is-active' : '') + (isToday ? ' is-today' : '') + '" data-day="' + d.id + '">'
        + '<span class="sdt-name">' + esc(d.short) + '</span>'
        + '<span class="sdt-num">' + d.id + '</span>'
        + '<span class="sdt-name">' + (isToday ? 'วันนี้' : esc(d.name_th).substring(0, 4)) + '</span>'
        + '</button>';
    });
    html += '</div>';
    return html;
  }

  function populateScheduleTarget(m) {
    var sel = $('#sc-target');
    if (!sel) return;
    var opts = [];
    if (SCHED_STATE.view === 'class') {
      opts = m.classes.map(function (c) { return { id: c.id, label: 'ชั้น ' + c.level }; });
    } else if (SCHED_STATE.view === 'teacher') {
      opts = m.teachers.map(function (t) { return { id: t.id, label: t.full_name || t.username }; });
    } else {
      opts = m.rooms.map(function (r) { return { id: r.id, label: r.code + ' · ' + r.name }; });
    }
    if (!SCHED_STATE.target_id && opts.length) SCHED_STATE.target_id = opts[0].id;
    sel.innerHTML = opts.map(function (o) {
      return '<option value="' + esc(o.id) + '"' + (String(o.id) === String(SCHED_STATE.target_id) ? ' selected' : '') + '>' + esc(o.label) + '</option>';
    }).join('');
  }

  function loadScheduleGrid() {
    var grid = $('#sc-grid'); if (!grid) return;
    grid.innerHTML = '<div class="skeleton" style="height:280px;border-radius:12px"></div>';
    call('schedule.grid', {
      view: SCHED_STATE.view, target_id: SCHED_STATE.target_id,
      term: SCHED_STATE.term, year: SCHED_STATE.year
    }).then(function (r) {
      SCHED_STATE.lastData = r;
      grid.innerHTML = renderScheduleGrid(r);
      updateScheduleKpi(r);
      updateGroupChipCounts(r);
      wireScheduleGrid();
      applyScheduleFilters();
    }).catch(function (e) {
      grid.innerHTML = '<div class="empty-state"><i class="bi bi-exclamation-circle"></i><p>' + esc(e.message) + '</p></div>';
    });
  }

  function updateScheduleKpi(r) {
    var teachers = {}, rooms = {}, classes = {};
    r.items.forEach(function (s) {
      if (s.teacher_id) teachers[s.teacher_id] = 1;
      if (s.room_id) rooms[s.room_id] = 1;
      if (s.class_id) classes[s.class_id] = 1;
    });
    var kpi = $('#sc-kpi');
    if (kpi) {
      kpi.innerHTML = ''
        + kpiCardHtml('bi-calendar3-week', 'จำนวนคาบ', r.total, 'คาบ')
        + kpiCardHtml('bi-people-fill', 'ครูที่สอน', Object.keys(teachers).length, 'คน')
        + kpiCardHtml('bi-door-open', 'ห้องที่ใช้', Object.keys(rooms).length, 'ห้อง')
        + kpiCardHtml('bi-grid-3x3', 'ชั้นที่เรียน', Object.keys(classes).length, 'ห้อง');
    }
  }

  function updateGroupChipCounts(r) {
    var m = Store.masters || {};
    var subjIdx = {};
    (m.subjects || []).forEach(function (s) { subjIdx[s.id] = s; });
    var counts = {};
    r.items.forEach(function (s) {
      var sub = subjIdx[s.subject_id];
      var g = (sub && sub.subject_group) || '';
      counts[g] = (counts[g] || 0) + 1;
    });
    var allCount = $('#sc-count-all');
    if (allCount) allCount.textContent = r.items.length;
    $$('[data-count-group]').forEach(function (el) {
      var g = el.getAttribute('data-count-group');
      el.textContent = counts[g] || 0;
    });
  }

  function renderScheduleGrid(r) {
    var m = Store.masters || { subjects: [], classes: [], rooms: [], teachers: [] };
    var periods = r.periods.sort(function (a, b) { return Number(a.no) - Number(b.no); });
    var canManage = hasCap('schedule.manage');
    var headHtml = '<th class="day-col">วัน \\ คาบ</th>' + periods.map(function (p) {
      if (isBreakPeriod(p)) {
        return '<th class="break-th"><i class="bi bi-cup-hot"></i> ' + esc(p.name || 'พัก')
          + '<div class="period-info">' + esc(p.start_time) + '-' + esc(p.end_time) + '</div></th>';
      }
      return '<th>คาบ ' + esc(p.no) + '<div class="period-info">' + esc(p.start_time) + '-' + esc(p.end_time) + '</div></th>';
    }).join('');
    var rowsHtml = r.days.map(function (d) {
      var cells = periods.map(function (p) {
        // Render break columns as gray "พัก" cells (non-droppable, non-clickable)
        if (isBreakPeriod(p)) {
          return '<td class="sched-cell is-break" data-period-label="' + esc(p.name || 'พัก') + '">'
            + '<div class="break-mark"><i class="bi bi-cup-hot"></i><span>' + esc(p.name || 'พัก') + '</span></div>'
            + '</td>';
        }
        var arr = (r.grid[d.id] && r.grid[d.id][p.id]) || [];
        var entry = arr[0];
        var periodLabel = 'คาบ ' + p.no + ' · ' + p.start_time + '-' + p.end_time;
        if (entry) {
          var sub = findMaster(m.subjects, entry.subject_id);
          var cls = findMaster(m.classes, entry.class_id);
          var rm = findMaster(m.rooms, entry.room_id);
          var tch = findMaster(m.teachers, entry.teacher_id);
          var grp = sub ? sub.subject_group : '';
          var isMine = String(entry.teacher_id) === String(Store.user.id);
          var label;
          if (SCHED_STATE.view === 'class') {
            label = '<div class="meta"><span class="teacher">' + esc(tch ? (tch.full_name || tch.username) : '') + '</span></div>';
          } else if (SCHED_STATE.view === 'teacher') {
            label = '<div class="meta"><span class="teacher">' + esc(cls ? cls.level : '') + '</span></div>';
          } else {
            label = '<div class="meta"><span class="teacher">' + esc(cls ? cls.level : '') + ' · ' + esc(tch ? (tch.full_name || tch.username) : '') + '</span></div>';
          }
          var dragAttr = canManage ? ' draggable="true"' : '';
          return '<td class="sched-cell" data-id="' + esc(entry.id) + '" data-day="' + d.id + '" data-period="' + esc(p.id) + '" data-period-label="' + esc(periodLabel) + '" data-teacher-id="' + esc(entry.teacher_id) + '" data-group="' + esc(grp) + '">'
            + '<div class="sched-card' + (isMine ? ' is-mine' : '') + '"' + dragAttr + ' data-group="' + esc(grp) + '" data-sched-id="' + esc(entry.id) + '">'
            + (canManage ? '<span class="drag-handle"><i class="bi bi-grip-vertical"></i></span>' : '')
            + '<div class="sub-code">' + esc(sub ? sub.code : '?') + '</div>'
            + '<div class="sub-name">' + esc(sub ? sub.name : '') + '</div>'
            + label + (rm ? ' <span class="room">' + esc(rm.code) + '</span>' : '')
            + '</div></td>';
        } else {
          return '<td class="sched-cell empty" data-day="' + d.id + '" data-period="' + esc(p.id) + '" data-period-label="' + esc(periodLabel) + '" data-empty="1">'
            + (canManage ? '<div class="empty-add"><i class="bi bi-plus-lg"></i></div>' : '<div class="empty-add"></div>')
            + '</td>';
        }
      });
      return '<tr data-day-row="' + d.id + '">'
        + '<td class="day-cell"><div>' + esc(d.name_th) + '</div></td>'
        + cells.join('')
        + '</tr>';
    }).join('');
    var classes = ['sched-grid'];
    if (SCHED_STATE.compact) classes.push('is-compact');
    return '<div class="sched-grid-wrap"><table class="' + classes.join(' ') + '" id="sc-table">'
      + '<thead><tr>' + headHtml + '</tr></thead>'
      + '<tbody>' + rowsHtml + '</tbody></table></div>'
      + '<div style="margin-top:10px;font-size:11px;color:var(--ink-muted);display:flex;gap:14px;flex-wrap:wrap">'
      + '<span><b>คำอธิบาย:</b></span>'
      + '<span><span style="display:inline-block;width:12px;height:12px;background:#d1fae5;border-left:3px solid #10b981;vertical-align:middle"></span> คาบของฉัน</span>'
      + '<span><i class="bi bi-grip-vertical"></i> ลากเพื่อย้าย/สลับคาบ</span>'
      + '</div>';
  }

  function wireScheduleToolbar(m) {
    var canManage = hasCap('schedule.manage');
    // mode toggle
    $$('.sched-mode-toggle button').forEach(function (b) {
      b.addEventListener('click', function () {
        SCHED_STATE.view = b.getAttribute('data-view');
        SCHED_STATE.target_id = '';
        $$('.sched-mode-toggle button').forEach(function (x) { x.classList.toggle('is-active', x === b); });
        populateScheduleTarget(m);
        loadScheduleGrid();
      });
    });
    // target
    var sel = $('#sc-target');
    if (sel) sel.addEventListener('change', function (e) {
      SCHED_STATE.target_id = e.target.value;
      loadScheduleGrid();
    });
    // search (debounced)
    var searchInput = $('#sc-search');
    var searchClear = $('#sc-search-clear');
    var searchWrap = searchInput && searchInput.parentElement;
    var t = null;
    if (searchInput) {
      searchInput.addEventListener('input', function (e) {
        SCHED_STATE.searchQuery = e.target.value;
        if (searchWrap) searchWrap.classList.toggle('has-value', !!e.target.value);
        clearTimeout(t);
        t = setTimeout(applyScheduleFilters, 200);
      });
      if (searchInput.value && searchWrap) searchWrap.classList.add('has-value');
    }
    if (searchClear) searchClear.addEventListener('click', function () {
      searchInput.value = ''; SCHED_STATE.searchQuery = '';
      if (searchWrap) searchWrap.classList.remove('has-value');
      applyScheduleFilters();
    });
    // group chips
    $$('#sc-group-chips .sched-group-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        var g = chip.getAttribute('data-group');
        SCHED_STATE.filterGroup = SCHED_STATE.filterGroup === g ? '' : g;
        // re-render chips for visual update
        renderSchedulePage(m);
      });
    });
    // day swiper
    $$('#sc-day-swiper .sched-day-tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        SCHED_STATE.selectedDay = Number(tab.getAttribute('data-day'));
        $$('#sc-day-swiper .sched-day-tab').forEach(function (x) { x.classList.toggle('is-active', x === tab); });
        applyScheduleFilters();
      });
    });
    // compact
    var bc = $('#sc-compact');
    if (bc) bc.addEventListener('click', function () {
      SCHED_STATE.compact = !SCHED_STATE.compact;
      try { localStorage.setItem('css.sched.compact', SCHED_STATE.compact ? '1' : '0'); } catch (e) {}
      var grid = $('#sc-table');
      if (grid) grid.classList.toggle('is-compact', SCHED_STATE.compact);
      var icon = bc.querySelector('i');
      if (icon) icon.className = 'bi ' + (SCHED_STATE.compact ? 'bi-arrows-angle-contract' : 'bi-arrows-angle-expand');
      var span = bc.querySelector('span');
      if (span) span.textContent = ' ' + (SCHED_STATE.compact ? 'ขยาย' : 'กะทัดรัด');
    });
    // refresh
    var br = $('#sc-refresh'); if (br) br.addEventListener('click', loadScheduleGrid);
    // print
    var bp = $('#sc-print'); if (bp) bp.addEventListener('click', function () { window.print(); });
    // export CSV
    var be = $('#sc-export'); if (be) be.addEventListener('click', exportScheduleCsv);
    // add
    var ba = $('#sc-add'); if (ba) ba.addEventListener('click', function () { openScheduleEditModal(null); });
    var fab = $('#sc-fab'); if (fab) fab.addEventListener('click', function () { openScheduleEditModal(null); });
    // magic — auto generate
    var bm = $('#sc-magic'); if (bm) bm.addEventListener('click', function () { openAutoScheduleWizard(); });
    // hint close
    var hc = $('#sc-hint-close');
    if (hc) hc.addEventListener('click', function () {
      SCHED_STATE.hideHint = true;
      try { localStorage.setItem('css.sched.hideHint', '1'); } catch (e) {}
      var hint = hc.parentElement; if (hint) hint.remove();
    });
  }

  function applyScheduleFilters() {
    if (!SCHED_STATE.lastData) return;
    var grid = $('#sc-table');
    if (!grid) return;
    var q = (SCHED_STATE.searchQuery || '').trim().toLowerCase();
    var filterGroup = SCHED_STATE.filterGroup;
    var dayFilter = SCHED_STATE.selectedDay;
    var m = Store.masters || {};
    var hasFilter = !!q || !!filterGroup;
    // filter cells
    $$('#sc-table .sched-cell').forEach(function (cell) {
      if (cell.hasAttribute('data-empty')) return;
      var grp = cell.getAttribute('data-group') || '';
      var card = cell.querySelector('.sched-card');
      var matchGroup = !filterGroup || grp === filterGroup;
      var matchSearch = true;
      if (q) {
        var text = card ? card.textContent.toLowerCase() : '';
        matchSearch = text.indexOf(q) >= 0;
      }
      var visible = matchGroup && matchSearch;
      if (card) {
        card.style.opacity = visible ? '1' : '.18';
        card.style.transition = 'opacity .2s';
      }
    });
    // day-only mode (mobile)
    var isDayOnly = window.innerWidth <= 768 && dayFilter > 0;
    grid.classList.toggle('is-day-only', isDayOnly);
    grid.classList.toggle('day-vertical', isDayOnly);
    if (isDayOnly) {
      $$('#sc-table tbody tr').forEach(function (tr) {
        var d = Number(tr.getAttribute('data-day-row'));
        tr.classList.toggle('is-active-day', d === dayFilter);
      });
    } else {
      $$('#sc-table tbody tr').forEach(function (tr) { tr.classList.remove('is-active-day'); });
    }
  }

  function exportScheduleCsv() {
    if (!SCHED_STATE.lastData) return;
    var m = Store.masters || {};
    var rows = [['วัน','คาบ','ช่วงเวลา','รหัสวิชา','ชื่อวิชา','ครู','ชั้น','ห้อง']];
    SCHED_STATE.lastData.items.forEach(function (s) {
      var sub = findMaster(m.subjects, s.subject_id);
      var cls = findMaster(m.classes, s.class_id);
      var rm = findMaster(m.rooms, s.room_id);
      var tch = findMaster(m.teachers, s.teacher_id);
      var pr = findMaster(m.periods, s.period_id);
      var d = (Store.boot.days || []).filter(function (x) { return x.id === Number(s.day); })[0];
      rows.push([
        d ? d.name_th : s.day,
        pr ? pr.no : '',
        pr ? (pr.start_time + '-' + pr.end_time) : '',
        sub ? sub.code : '',
        sub ? sub.name : '',
        tch ? (tch.full_name || tch.username) : '',
        cls ? cls.level : '',
        rm ? rm.code : ''
      ]);
    });
    var csv = '﻿' + rows.map(function (r) {
      return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'schedule_' + SCHED_STATE.term + '_' + SCHED_STATE.year + '.csv';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('ส่งออก CSV สำเร็จ', 'success');
  }

  function wireScheduleGrid() {
    var canManage = hasCap('schedule.manage');
    // click handlers (use delegation for simplicity)
    $$('#sc-table .sched-cell').forEach(function (cell) {
      // skip break cells — no click action, no add, no drop
      if (cell.classList.contains('is-break')) return;
      // click → open detail or add
      cell.addEventListener('click', function (e) {
        if (DnD.startedDrag) return;  // ignore click after drag
        if (cell.hasAttribute('data-empty')) {
          if (!canManage) return;
          openScheduleEditModal({
            day: Number(cell.getAttribute('data-day')),
            period_id: cell.getAttribute('data-period')
          });
        } else {
          var id = cell.getAttribute('data-id');
          openScheduleDetailModal(id);
        }
      });
      // hover → highlight related teacher
      var tid = cell.getAttribute('data-teacher-id');
      if (tid) {
        cell.addEventListener('mouseenter', function () { highlightTeacher(tid); });
        cell.addEventListener('mouseleave', function () { highlightTeacher(null); });
      }
    });
    // setup DnD
    if (canManage) setupDnD();
  }

  function highlightTeacher(tid) {
    SCHED_STATE.highlightedTeacher = tid;
    $$('#sc-table .sched-cell').forEach(function (cell) {
      var ctid = cell.getAttribute('data-teacher-id');
      if (!tid) {
        cell.classList.remove('is-related');
        cell.classList.remove('is-dimmed');
      } else {
        if (ctid === tid) cell.classList.add('is-related');
        else cell.classList.remove('is-related');
      }
    });
  }

  // ── Drag and Drop ─────────────────────────────────────────
  var DnD = {
    draggingId: null,
    startedDrag: false,
    ghost: null,
    target: null,
    targetSwap: false
  };

  function setupDnD() {
    var grid = $('#sc-table');
    if (!grid) return;
    $$('.sched-card[draggable="true"]', grid).forEach(function (card) {
      card.addEventListener('dragstart', onDragStart);
      card.addEventListener('dragend', onDragEnd);
    });
    // Skip break cells from drop targets — can't drop classes onto lunch break
    $$('.sched-cell:not(.is-break)', grid).forEach(function (cell) {
      cell.addEventListener('dragover', onDragOver);
      cell.addEventListener('dragenter', onDragEnter);
      cell.addEventListener('dragleave', onDragLeave);
      cell.addEventListener('drop', onDrop);
    });
    // touch support via long-press → start manual DnD
    setupTouchDnD(grid);
  }

  function onDragStart(e) {
    var card = e.currentTarget;
    var id = card.getAttribute('data-sched-id');
    if (!id) return;
    DnD.draggingId = id;
    DnD.startedDrag = true;
    var cell = card.closest('.sched-cell');
    if (cell) cell.classList.add('is-dragging');
    try {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', id);
      // create custom drag image
      var dragImg = document.createElement('div');
      dragImg.style.cssText = 'position:absolute;top:-1000px;background:white;border:2px solid #6366f1;border-radius:10px;padding:8px 12px;font-weight:700;color:#6366f1';
      dragImg.textContent = card.querySelector('.sub-code') ? card.querySelector('.sub-code').textContent : '?';
      document.body.appendChild(dragImg);
      e.dataTransfer.setDragImage(dragImg, 20, 20);
      setTimeout(function () { dragImg.remove(); }, 0);
    } catch (err) {}
  }

  function onDragEnd() {
    setTimeout(function () { DnD.startedDrag = false; }, 50);
    DnD.draggingId = null;
    $$('.sched-cell').forEach(function (c) {
      c.classList.remove('is-dragging', 'drop-target', 'drop-invalid', 'drop-swap');
    });
  }

  function onDragOver(e) {
    if (!DnD.draggingId) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch (err) {}
  }

  function onDragEnter(e) {
    if (!DnD.draggingId) return;
    var cell = e.currentTarget;
    if (cell.getAttribute('data-id') === DnD.draggingId) return;
    if (cell.hasAttribute('data-empty')) {
      cell.classList.add('drop-target');
    } else {
      cell.classList.add('drop-swap');
    }
  }

  function onDragLeave(e) {
    var cell = e.currentTarget;
    cell.classList.remove('drop-target', 'drop-invalid', 'drop-swap');
  }

  function onDrop(e) {
    e.preventDefault();
    if (!DnD.draggingId) return;
    var cell = e.currentTarget;
    cell.classList.remove('drop-target', 'drop-invalid', 'drop-swap');
    if (cell.getAttribute('data-id') === DnD.draggingId) return;
    var targetDay = Number(cell.getAttribute('data-day'));
    var targetPeriod = cell.getAttribute('data-period');
    var targetId = cell.getAttribute('data-id');  // null if empty
    moveSchedule(DnD.draggingId, targetDay, targetPeriod, targetId);
  }

  function moveSchedule(sourceId, targetDay, targetPeriod, targetId) {
    var src = findScheduleItem(sourceId);
    if (!src) return toast('ไม่พบคาบต้นทาง', 'error');
    if (targetId && String(targetId) === String(sourceId)) return;
    if (targetId) {
      // SWAP
      var tgt = findScheduleItem(targetId);
      if (!tgt) return toast('ไม่พบคาบปลายทาง', 'error');
      Spinner.show('กำลังสลับคาบ...');
      // update src → target's day/period; update target → src's day/period
      var u1 = {
        id: src.id,
        day: Number(tgt.day), period_id: tgt.period_id,
        class_id: src.class_id, subject_id: src.subject_id,
        teacher_id: src.teacher_id, room_id: src.room_id,
        term: src.term, year: src.year, force: true
      };
      var u2 = {
        id: tgt.id,
        day: Number(src.day), period_id: src.period_id,
        class_id: tgt.class_id, subject_id: tgt.subject_id,
        teacher_id: tgt.teacher_id, room_id: tgt.room_id,
        term: tgt.term, year: tgt.year, force: true
      };
      // do swap in 3 steps to avoid temporary conflict (no temp slot needed since we use force)
      call('schedule.update', u1).then(function () {
        return call('schedule.update', u2);
      }).then(function () {
        Spinner.hide();
        toast('สลับคาบสำเร็จ', 'success');
        loadScheduleGrid();
      }).catch(function (e) {
        Spinner.hide(); toast(e.message || 'สลับไม่สำเร็จ', 'error');
        loadScheduleGrid();
      });
    } else {
      // MOVE to empty
      Spinner.show('กำลังย้ายคาบ...');
      var payload = {
        id: src.id,
        day: targetDay, period_id: targetPeriod,
        class_id: src.class_id, subject_id: src.subject_id,
        teacher_id: src.teacher_id, room_id: src.room_id,
        term: src.term, year: src.year
      };
      call('schedule.update', payload).then(function (r) {
        Spinner.hide();
        if (r.ok === false && r.conflicts) {
          var msgs = r.conflicts.map(function (c) {
            return ({ teacher: 'ครู', class: 'ชั้น', room: 'ห้อง' }[c.type] || c.type) + 'ซ้อนคาบ';
          }).join(', ');
          confirmModal({
            title: 'มีคาบที่ชนกัน',
            message: 'เกิดการชนกัน: ' + msgs + ' — ต้องการบังคับย้ายหรือไม่?',
            danger: true, okText: 'บังคับย้าย', icon: 'bi-exclamation-triangle-fill'
          }).then(function (yes) {
            if (!yes) return;
            payload.force = true;
            Spinner.show('กำลังย้าย...');
            call('schedule.update', payload).then(function () {
              Spinner.hide(); toast('ย้ายสำเร็จ', 'success'); loadScheduleGrid();
            }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); });
          });
        } else {
          toast('ย้ายคาบสำเร็จ', 'success');
          loadScheduleGrid();
        }
      }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); });
    }
  }

  function findScheduleItem(id) {
    if (!SCHED_STATE.lastData) return null;
    for (var i = 0; i < SCHED_STATE.lastData.items.length; i++) {
      if (String(SCHED_STATE.lastData.items[i].id) === String(id)) return SCHED_STATE.lastData.items[i];
    }
    return null;
  }

  // ── Touch DnD (long-press → manual ghost) ────────────────
  function setupTouchDnD(grid) {
    var pressTimer = null;
    var startCell = null;
    var ghost = null;
    var ghostX = 0, ghostY = 0;
    var moved = false;
    var touchStartX = 0, touchStartY = 0;
    function cleanup() {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      if (ghost) { ghost.remove(); ghost = null; }
      if (startCell) startCell.classList.remove('is-dragging');
      $$('.sched-cell').forEach(function (c) { c.classList.remove('drop-target', 'drop-invalid', 'drop-swap'); });
      startCell = null;
      DnD.draggingId = null;
      moved = false;
    }
    grid.addEventListener('touchstart', function (e) {
      var card = e.target.closest('.sched-card[draggable="true"]');
      if (!card) return;
      startCell = card.closest('.sched-cell');
      var id = card.getAttribute('data-sched-id');
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      moved = false;
      pressTimer = setTimeout(function () {
        // long press → start drag
        DnD.draggingId = id;
        DnD.startedDrag = true;
        startCell.classList.add('is-dragging');
        // create ghost
        ghost = document.createElement('div');
        ghost.className = 'sched-ghost';
        var subEl = card.querySelector('.sub-code');
        var nameEl = card.querySelector('.sub-name');
        ghost.innerHTML = '<div class="sched-ghost-title">' + (subEl ? subEl.textContent : '?') + '</div>'
          + (nameEl ? '<div class="sched-ghost-meta">' + nameEl.textContent + '</div>' : '');
        document.body.appendChild(ghost);
        ghostX = e.touches[0].clientX;
        ghostY = e.touches[0].clientY;
        ghost.style.left = ghostX + 'px';
        ghost.style.top = ghostY + 'px';
        // haptic
        if (navigator.vibrate) try { navigator.vibrate(40); } catch (er) {}
      }, 350);
    }, { passive: true });
    grid.addEventListener('touchmove', function (e) {
      if (!ghost && pressTimer) {
        var dx = Math.abs(e.touches[0].clientX - touchStartX);
        var dy = Math.abs(e.touches[0].clientY - touchStartY);
        if (dx > 8 || dy > 8) {
          // moved before long press fired → cancel (allow scroll)
          clearTimeout(pressTimer); pressTimer = null;
        }
        return;
      }
      if (!ghost) return;
      e.preventDefault();
      ghostX = e.touches[0].clientX;
      ghostY = e.touches[0].clientY;
      ghost.style.left = ghostX + 'px';
      ghost.style.top = ghostY + 'px';
      // find target
      ghost.style.display = 'none';
      var el = document.elementFromPoint(ghostX, ghostY);
      ghost.style.display = '';
      var cell = el && el.closest && el.closest('.sched-cell');
      $$('.sched-cell').forEach(function (c) { c.classList.remove('drop-target', 'drop-invalid', 'drop-swap'); });
      if (cell && cell.getAttribute('data-id') !== DnD.draggingId) {
        if (cell.hasAttribute('data-empty')) { cell.classList.add('drop-target'); ghost.classList.remove('is-swap'); }
        else { cell.classList.add('drop-swap'); ghost.classList.add('is-swap'); }
      }
    }, { passive: false });
    grid.addEventListener('touchend', function (e) {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      if (!ghost) return;
      var el = document.elementFromPoint(ghostX, ghostY);
      var cell = el && el.closest && el.closest('.sched-cell');
      if (cell && cell.getAttribute('data-id') !== DnD.draggingId) {
        var sourceId = DnD.draggingId;
        var targetDay = Number(cell.getAttribute('data-day'));
        var targetPeriod = cell.getAttribute('data-period');
        var targetId = cell.getAttribute('data-id');
        cleanup();
        moveSchedule(sourceId, targetDay, targetPeriod, targetId);
        setTimeout(function () { DnD.startedDrag = false; }, 50);
        return;
      }
      cleanup();
      setTimeout(function () { DnD.startedDrag = false; }, 50);
    });
    grid.addEventListener('touchcancel', cleanup);
  }

  function openAutoScheduleWizard() {

    var html = '<div class="wiz-steps">';
    steps.forEach(function (s, i) {
      var done = WIZ.step > s.n;

        + '</div>';
      if (i < steps.length - 1) html += '<div class="wiz-step-line' + (done ? ' is-done' : '') + '"></div>';

  function wireWizardModal(card) {
    var btnCancel = card.querySelector('[data-act="cancel"]');
    var btnNext = card.querySelector('[data-act="next"]');
    var btnBack = card.querySelector('[data-act="back"]');
    var btnGen = card.querySelector('[data-act="generate"]');
    if (btnCancel) btnCancel.addEventListener('click', Modal.close);
    if (btnNext) btnNext.addEventListener('click', function () {
      if (Object.values(WIZ.selectedClasses).filter(Boolean).length === 0) return toast('เลือกอย่างน้อย 1 ชั้น', 'warning');
      WIZ.lockExisting = $('#wiz-lock') ? $('#wiz-lock').checked : false;
      WIZ.step = 2; renderWizardModal();
    });
    if (btnBack) btnBack.addEventListener('click', function () { WIZ.step = 1; renderWizardModal(); });
    if (btnGen) btnGen.addEventListener('click', startAutoGenerate);
    // class checkbox
    $$('[data-class-cb]', card).forEach(function (cb) {
      cb.addEventListener('change', function () {
        var cid = cb.getAttribute('data-class-cb');
        WIZ.selectedClasses[cid] = cb.checked;
        cb.closest('.wiz-class-cb').classList.toggle('is-checked', cb.checked);
      });
    });
    // select all/none
    var sa = card.querySelector('[data-act="select-all"]');
    var sn = card.querySelector('[data-act="select-none"]');
    if (sa) sa.addEventListener('click', function () {
      WIZ.classes.forEach(function (c) { WIZ.selectedClasses[c.id] = true; });
      renderWizardModal();
    });
    if (sn) sn.addEventListener('click', function () {
      WIZ.classes.forEach(function (c) { WIZ.selectedClasses[c.id] = false; });
      renderWizardModal();
    });
    // matrix inputs
    $$('.wiz-matrix-input', card).forEach(function (inp) {
      inp.addEventListener('input', function () {
        var key = inp.getAttribute('data-cell').split('|');
        var cid = key[0], sid = key[1];
        var v = Math.max(0, Math.floor(Number(inp.value) || 0));
        if (!WIZ.matrix[cid]) WIZ.matrix[cid] = {};
        WIZ.matrix[cid][sid] = v;
        inp.classList.toggle('has-value', v > 0);
        // update class total
        var totalEl = card.querySelector('[data-class-total="' + cid + '"]');
        if (totalEl) {
          var total = 0;
          Object.keys(WIZ.matrix[cid]).forEach(function (k) { total += Number(WIZ.matrix[cid][k] || 0); });
          totalEl.textContent = total;
          totalEl.classList.remove('is-good', 'is-warning', 'is-danger');
          if (total > WIZ.maxSlots) totalEl.classList.add('is-danger');
          else if (total > WIZ.maxSlots * 0.85) totalEl.classList.add('is-warning');
          else if (total > 0) totalEl.classList.add('is-good');
        }
      });
      inp.addEventListener('focus', function () { inp.select(); });
    });
    // quick chips
    $$('.wiz-quick-chip', card).forEach(function (ch) {
      ch.addEventListener('click', function () {
        var q = ch.getAttribute('data-quick');
        WIZ.classes.filter(function (c) { return WIZ.selectedClasses[c.id]; }).forEach(function (c) {
          if (!WIZ.matrix[c.id]) WIZ.matrix[c.id] = {};
          WIZ.subjects.forEach(function (s) {
            if (q === 'default') WIZ.matrix[c.id][s.id] = Math.max(1, Math.round(Number(s.credits || 1)));
            else WIZ.matrix[c.id][s.id] = Number(q);
          });
        });
        renderWizardModal();
      });
    });
  }

  function startAutoGenerate() {
    WIZ.step = 3; renderWizardModal();
    // Animated step messages while waiting for backend
    var steps = [
      '📊 วิเคราะห์ความต้องการของแต่ละชั้น...',
      '👥 จับคู่ครู → กลุ่มสาระ → วิชา...',
      '🏫 จัดสรรห้องเรียนตามความเหมาะสม...',
      '⚡ ตรวจสอบการชนกัน + Load balance...',
      '🎯 หาช่วงเวลาที่ดีที่สุดด้วย Heuristic...',
      '✨ บันทึกตารางใหม่ลงระบบ...'
    ];
    var stepIdx = 0;
    var stepEl = $('#wiz-step-text');
    var progEl = $('#wiz-progress');
    var stepTimer = setInterval(function () {
      stepIdx = (stepIdx + 1) % steps.length;
      if (stepEl) stepEl.textContent = steps[stepIdx];
    }, 800);
    var prog = 0;
    var progTimer = setInterval(function () {
      prog = Math.min(85, prog + Math.random() * 8);
      if (progEl) progEl.style.width = prog + '%';
    }, 400);
    if (stepEl) stepEl.textContent = steps[0];
    // Build payload (only selected classes)
    var matrix = {};
    Object.keys(WIZ.matrix).forEach(function (cid) {
      if (WIZ.selectedClasses[cid]) matrix[cid] = WIZ.matrix[cid];
    });
    call('autoSchedule.generate', {
      term: SCHED_STATE.term,
      year: SCHED_STATE.year,
      lock_existing: WIZ.lockExisting,
      matrix: matrix
    }).then(function (r) {
      clearInterval(stepTimer); clearInterval(progTimer);
      if (progEl) progEl.style.width = '100%';
      setTimeout(function () { showAutoGenResult(r); }, 400);
    }).catch(function (e) {
      clearInterval(stepTimer); clearInterval(progTimer);
      showAutoGenResult({ error: e.message });
    });
  }

  function showAutoGenResult(r) {
    var thinking = $('#wiz-thinking');
    var resultEl = $('#wiz-result');
    if (thinking) thinking.style.display = 'none';
    if (!resultEl) return;
    if (r.error) {
      resultEl.innerHTML = '<div class="wiz-result">'
        + '<div class="wiz-result-icon is-error"><i class="bi bi-x-lg"></i></div>'
        + '<div class="wiz-result-title">เกิดข้อผิดพลาด</div>'
        + '<div class="wiz-result-sub">' + esc(r.error) + '</div>'
        + '</div>';
    } else {
      var success = r.success_rate >= 95;
      var partial = r.success_rate >= 75 && r.success_rate < 95;
      var iconCls = success ? '' : partial ? 'is-warning' : 'is-error';
      var icon = success ? 'bi-check-lg' : partial ? 'bi-exclamation-lg' : 'bi-info-lg';
      var title = success ? '🎉 จัดตารางสำเร็จสมบูรณ์!' : partial ? 'จัดเสร็จแล้ว (มีบางส่วนติดขัด)' : 'จัดได้บางส่วน';
      var sub = 'อัตราสำเร็จ ' + r.success_rate + '% · ใช้เวลา ' + (r.duration_ms / 1000).toFixed(1) + ' วินาที';
      var failedHtml = '';
      if (r.failed_summary && r.failed_summary.length) {
        failedHtml = '<div class="wiz-failed-list">'
          + '<h5><i class="bi bi-exclamation-triangle-fill"></i> รายการที่จัดไม่ได้ (' + r.failed_summary.length + ' กลุ่ม)</h5>'
          + r.failed_summary.map(function (f) {
              return '<div class="wiz-failed-row">'
                + '<span class="wfr-class">' + esc(f.class_level) + '</span>'
                + '<span class="wfr-subj">' + esc(f.subject_code) + ' ' + esc(f.subject_name) + '</span>'
                + '<span class="wfr-count">ขาด ' + f.missing + '</span>'
                + '</div>';
            }).join('')
          + '<div style="padding:10px 12px;font-size:11px;color:#7f1d1d;background:#fef2f2"><i class="bi bi-info-circle"></i> สาเหตุ: อาจไม่มีครูในกลุ่มสาระ หรือคาบในสัปดาห์ไม่พอ ลองลดชั่วโมง หรือเพิ่มครู/คาบ</div>'
          + '</div>';
      }
      resultEl.innerHTML = '<div class="wiz-result">'
        + '<div class="wiz-result-icon ' + iconCls + '"><i class="bi ' + icon + '"></i></div>'
        + '<div class="wiz-result-title">' + esc(title) + '</div>'
        + '<div class="wiz-result-sub">' + esc(sub) + '</div>'
        + '<div class="wiz-result-stats">'
        +   '<div class="wiz-result-stat success"><div class="wiz-result-stat-label">จัดสำเร็จ</div><div class="wiz-result-stat-value">' + r.created + '</div></div>'
        +   '<div class="wiz-result-stat"><div class="wiz-result-stat-label">ที่ขอ</div><div class="wiz-result-stat-value">' + r.requested + '</div></div>'
        +   '<div class="wiz-result-stat ' + (r.failed > 0 ? 'warning' : 'success') + '"><div class="wiz-result-stat-label">ขาด</div><div class="wiz-result-stat-value">' + r.failed + '</div></div>'
        + '</div>'
        + (r.cleared > 0 ? '<div style="font-size:11px;color:var(--ink-muted);margin:8px 0">ลบตารางเดิม ' + r.cleared + ' คาบ ก่อนจัดใหม่</div>' : '')
        + failedHtml
        + '</div>';
      if (success) launchConfetti();
    }
    resultEl.removeAttribute('hidden');
    var cb = document.querySelector('[data-act="close"]');
    if (cb) {
      cb.removeAttribute('hidden');
      cb.textContent = 'ดูตารางใหม่';
      cb.className = 'btn btn-primary';
      cb.addEventListener('click', function () {
        Modal.close();
        loadScheduleGrid();
      });
    }
  }

  function launchConfetti() {

    for (var i = 0; i < 60; i++) {
      var p = document.createElement('div');

      p.style.left = Math.random() * 100 + '%';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];

    setTimeout(function () { host.remove(); }, 4500);

    +     kpiCardHtml('bi-x-circle', 'ไม่อนุมัติ', rejected.length, 'รายการ')
    +   '</div>'
    + '</div>'
    + '<div class="panel">'
    +   '<div class="toolbar">'
    +     '<select class="select" id="ab-status">'
    +       '<option value="">ทั้งหมด</option>'
    +       '<option value="pending">รออนุมัติ</option>'
    +       '<option value="approved">อนุมัติแล้ว</option>'
    +       '<option value="rejected">ไม่อนุมัติ</option>'
    +     '</select>'
    +     (canCreate ? '<button class="btn btn-primary" id="ab-add" style="margin-left:auto"><i class="bi bi-plus-lg"></i> แจ้งลา</button>' : '')
    +   '</div>'
    +   '<div id="ab-list">' + renderAbsenceList(d.items, m) + '</div>'

      var v = e.target.value;
      var items = v ? d.items.filter(function (a) { return a.status === v; }) : d.items;

  function renderAbsenceList(items, m) {
    if (!items.length) return '<div class="empty-state"><i class="bi bi-inbox"></i><p>ไม่มีรายการลา</p></div>';
    var reasons = (Store.boot.absence_reasons || []).reduce(function (acc, r) { acc[r.key] = r; return acc; }, {});
    var rows = items.map(function (a) {
      var r = reasons[a.reason] || { label: a.reason, color: '#64748b', icon: 'bi-question-circle' };
      var statusBadge = a.status === 'pending' ? '<span class="badge b-pending"><i class="bi bi-hourglass"></i> รออนุมัติ</span>'
        : a.status === 'approved' ? '<span class="badge b-approved"><i class="bi bi-check-circle"></i> อนุมัติ</span>'
        : '<span class="badge b-rejected"><i class="bi bi-x-circle"></i> ไม่อนุมัติ</span>';
      return '<div class="card-item" data-id="' + esc(a.id) + '">'
        + '<div style="display:flex;align-items:center;gap:10px">'
        +   '<div class="avatar-circle" style="background:' + esc(r.color) + '"><i class="bi ' + r.icon + '"></i></div>'
        +   '<div style="flex:1;min-width:0"><div style="font-weight:700">' + esc(a._teacher_name || '-') + '</div>'
        +   '<div style="font-size:11px;color:var(--ink-muted)">' + esc(r.label) + ' · ' + TH.dateLong(a.date) + '</div></div>'
        +   statusBadge
        + '</div>'
        + (a.reason_detail ? '<div style="font-size:12px;color:var(--ink-muted);margin-top:6px">' + esc(a.reason_detail) + '</div>' : '')
        + '<div style="font-size:11px;color:var(--ink-muted);margin-top:4px">คาบ: ' + esc(a.periods === 'all' ? 'ทั้งวัน' : a.periods) + '</div>'
        + '</div>';
    }).join('');
    return '<div class="cards-grid">' + rows + '</div>';
  }

  function wireAbsenceList(d, m) {
    $$('.cards-grid .card-item').forEach(function (card) {
      card.addEventListener('click', function () {
        var id = card.getAttribute('data-id');
        var a = d.items.filter(function (x) { return String(x.id) === String(id); })[0];
        if (a) openAbsenceDetailModal(a, m);
      });
    });
  }

    var canTargetOthers = hasCap('absence.manage');
    var teachers = m.teachers;
    var reasons = Store.boot.absence_reasons || [];
    var html = ''
    + (canTargetOthers ? '<div class="field"><label class="field-label">ครูที่ลา <span class="req">*</span></label>'
      + '<select class="select" id="ab-teacher"><option value="' + esc(Store.user.id) + '">' + esc(Store.user.full_name || Store.user.username) + ' (ตัวคุณเอง)</option>'
      + teachers.filter(function (t) { return String(t.id) !== String(Store.user.id); }).map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(t.full_name || t.username) + '</option>'; }).join('') + '</select></div>'
      : '')
    + '<div class="field"><label class="field-label">วันที่ลา <span class="req">*</span></label>'
    + '<input class="input" type="date" id="ab-date" value="' + TH.iso(new Date()) + '"></div>'
    + '<div class="field"><label class="field-label">คาบที่ลา</label>'

    + '</select><div class="field-hint">เลือก "ทั้งวัน" หรือคาบใดคาบหนึ่ง</div></div>'

    + '<div class="field"><label class="field-label">รายละเอียด</label>'
    + '<textarea class="textarea" id="ab-detail" placeholder="เช่น ป่วยเป็นไข้ / ไปอบรมที่กรุงเทพ"></textarea></div>';

      + '<button class="btn btn-primary" data-act="save"><i class="bi bi-check-lg"></i> แจ้งลา</button>';
    Modal.open({
      title: 'แจ้งลา', html: html, footer: footer,
      onOpen: function (c) {
        c.querySelector('[data-act="cancel"]').addEventListener('click', Modal.close);
        c.querySelector('[data-act="save"]').addEventListener('click', function () {

          }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); });

  function openAbsenceDetailModal(a, m) {
    var canApprove = hasCap('absence.approve') && a.status === 'pending';
    var canDelete = (String(a.teacher_id) === String(Store.user.id) && a.status === 'pending') || hasCap('absence.manage');
    var canSubstitute = hasCap('substitute.manage') && a.status === 'approved';
    var reasons = (Store.boot.absence_reasons || []).reduce(function (acc, r) { acc[r.key] = r; return acc; }, {});
    var r = reasons[a.reason] || { label: a.reason, icon: 'bi-question-circle', color: '#64748b' };
    var statusBadge = a.status === 'pending' ? '<span class="badge b-pending">รออนุมัติ</span>'
      : a.status === 'approved' ? '<span class="badge b-approved">อนุมัติแล้ว</span>'
      : '<span class="badge b-rejected">ไม่อนุมัติ</span>';
    var html = ''
    + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">'
    +   '<div class="avatar-circle avatar-lg" style="background:' + esc(r.color) + '"><i class="bi ' + r.icon + '" style="font-size:24px"></i></div>'
    +   '<div><div style="font-weight:700;font-size:16px">' + esc(a._teacher_name) + '</div>'
    +   '<div style="font-size:12px;color:var(--ink-muted)">' + esc(r.label) + '</div>'

    + '<div class="field"><label class="field-label">วันที่</label><div>' + TH.dateLongWeekday(a.date) + '</div></div>'

    + (a.reason_detail ? '<div class="field"><label class="field-label">รายละเอียด</label><div>' + esc(a.reason_detail) + '</div></div>' : '')

    + '<div style="font-size:11px;color:var(--ink-muted);margin-top:8px">แจ้งเมื่อ: ' + TH.smart(a.created_at) + '</div>';
